name: Build and Release All Flavors (Windows & Linux)

on:
  push:
    branches:
      - main
      - python-main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v3.4.3)'
        required: false
        default: 'v3.4.3'

permissions:
  contents: write

jobs:
  # ==========================================
  # STAGE 1: Parallel Multi-Platform Builds
  # ==========================================
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows GPU
          - target: Windows-GPU
            os: windows-latest
            target_id: windows-gpu
            is_gpu: true
            bundle: MangaCleaner_GPU

          # 2. Windows CPU
          - target: Windows-CPU
            os: windows-latest
            target_id: windows-cpu
            is_gpu: false
            bundle: MangaCleaner_CPU

          # 3. Linux CPU
          - target: Linux-CPU
            os: ubuntu-latest
            target_id: linux-cpu
            is_gpu: false
            bundle: MangaCleaner_CPU

          # 4. Linux GPU
          - target: Linux-GPU
            os: ubuntu-latest
            target_id: linux-gpu
            is_gpu: true
            bundle: MangaCleaner_GPU

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version Variable
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.inputs.version_tag || 'v3.4.3' }}" >> $GITHUB_ENV
          fi

      # --- Linux System Dependencies ---
      - name: Install Linux Build Dependencies & 7-Zip
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            libx11-xcb1 \
            p7zip-full

      # --- Python Setup ---
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Validate approved translation catalogs
        run: python tools/check_locales.py --release

      - name: Install Python Dependencies (Windows & Linux CPU)
        if: runner.os == 'Windows' || matrix.is_gpu == false
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Install Python Dependencies (Linux GPU)
        if: runner.os == 'Linux' && matrix.is_gpu
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements_linux.txt

      - name: Validate Linux GPU Build Dependencies
        if: runner.os == 'Linux' && matrix.is_gpu
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          required_packages = {
              "nvidia-cublas": ("nvidia.cublas", "nvidia_cublas"),
              "nvidia-cuda-nvrtc": ("nvidia.cuda_nvrtc", "nvidia_cuda_nvrtc"),
              "nvidia-cuda-runtime": ("nvidia.cuda_runtime", "nvidia_cuda_runtime"),
              "nvidia-cudnn": ("nvidia.cudnn", "nvidia_cudnn"),
              "nvidia-cufft": ("nvidia.cufft", "nvidia_cufft"),
              "nvidia-nvjitlink": ("nvidia.nvjitlink", "nvidia_nvjitlink"),
          }
          missing = []
          for dependency_name, module_candidates in required_packages.items():
              if not any(importlib.util.find_spec(pkg) is not None for pkg in module_candidates):
                  missing.append(f"{dependency_name} ({', '.join(module_candidates)})")
          if missing:
              print("Missing required Linux GPU Python packages:")
              for pkg in missing:
                  print(f" - {pkg}")
              sys.exit(1)
          print("All required Linux GPU NVIDIA packages verified.")
          PY

      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller==6.18.0

      # --- GPU Wheels (Only for Windows GPU build) ---
      - name: Install CUDA 12 & cuDNN 9 DLL Wheels (Windows GPU Only)
        if: runner.os == 'Windows' && matrix.is_gpu
        run: |
          python -m pip install nvidia-cuda-runtime-cu12 nvidia-cudnn-cu12 nvidia-cublas-cu12 nvidia-cufft-cu12 nvidia-curand-cu12

      # --- Native Build with build.py ---
      - name: Build Target (${{ matrix.target_id }})
        run: |
          python build.py --target ${{ matrix.target_id }} --yes

      # --- 512 MB Split Compression ---
      - name: Compress into 512MB Multi-part Zips (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $distSubfolder = "dist\${{ matrix.target_id }}\${{ matrix.bundle }}"
          $archiveName = "MangaCleaner-${{ env.VERSION }}-${{ matrix.target }}.zip"
          7z a -v512m $archiveName "$distSubfolder\*"

      - name: Compress into 512MB Multi-part Zips (Linux)
        if: runner.os == 'Linux'
        run: |
          DIST_SUBFOLDER="dist/${{ matrix.target_id }}/${{ matrix.bundle }}"
          ARCHIVE_NAME="MangaCleaner-${{ env.VERSION }}-${{ matrix.target }}.zip"
          7z a -v512m "$ARCHIVE_NAME" "$DIST_SUBFOLDER/*"

      # --- Upload Staged Artifacts ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.target }}
          path: MangaCleaner-*-${{ matrix.target }}.zip*
          if-no-files-found: error

  # ==========================================
  # STAGE 2: Aggregate & Publish GitHub Release
  # ==========================================
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version Variable
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.inputs.version_tag || 'v3.4.3' }}" >> $GITHUB_ENV
          fi

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          merge-multiple: true
          path: release-assets

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Manga Cleaner ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/MangaCleaner-*.zip*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
