name: Build and Release All Flavors (Windows & Linux)

on:
  push:
    tags:
      - 'v*' # Triggers when pushing tags like v3.2.0
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v3.2.0)'
        required: true
        default: 'v3.2.0'

permissions:
  contents: write

jobs:
  # ==========================================
  # STAGE 1: Parallel Multi-Platform Builds
  # ==========================================
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows GPU
          - target: Windows-GPU
            os: windows-latest
            spec: MangaCleaner_GPU.spec
            is_gpu: true

          # 2. Windows CPU
          - target: Windows-CPU
            os: windows-latest
            spec: MangaCleaner_CPU.spec
            is_gpu: false

          # 3. Windows CPU Clean
          - target: Windows-CPU-Clean
            os: windows-latest
            spec: MangaCleaner_CPU_clean.spec
            is_gpu: false

          # 4. Linux CPU
          - target: Linux-CPU
            os: ubuntu-latest
            spec: MangaCleaner_CPU_linux.spec
            is_gpu: false

          # 5. Linux GPU
          - target: Linux-GPU
            os: ubuntu-latest
            spec: MangaCleaner_GPU_linux.spec
            is_gpu: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version Variable
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.inputs.version_tag || 'v3.2.0' }}" >> $GITHUB_ENV
          fi

      # --- Linux System Dependencies ---
      - name: Install Linux Build Dependencies & 7-Zip
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 p7zip-full

      # --- Python Setup ---
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Validate approved translation catalogs
        run: python tools/check_locales.py --release

      - name: Install Python Dependencies (Windows & Linux CPU)
        if: runner.os == 'Windows' || matrix.is_gpu == false
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Install Python Dependencies (Linux GPU)
        if: runner.os == 'Linux' && matrix.is_gpu
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements_linux.txt

      - name: Validate Linux GPU Build Dependencies
        if: runner.os == 'Linux' && matrix.is_gpu
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          required_packages = {
              "nvidia-cublas": ("nvidia.cublas", "nvidia_cublas"),
              "nvidia-cuda-nvrtc": ("nvidia.cuda_nvrtc", "nvidia_cuda_nvrtc"),
              "nvidia-cuda-runtime": ("nvidia.cuda_runtime", "nvidia_cuda_runtime"),
              "nvidia-cudnn-cu13": ("nvidia.cudnn",),
              "nvidia-cufft": ("nvidia.cufft", "nvidia_cufft"),
              "nvidia-curand": ("nvidia.curand", "nvidia_curand"),
              "nvidia-nvjitlink": ("nvidia.nvjitlink", "nvidia_nvjitlink"),
          }
          missing = []
          for dependency_name, module_candidates in required_packages.items():
              if not any(importlib.util.find_spec(pkg) is not None for pkg in module_candidates):
                  missing.append(f"{dependency_name} ({', '.join(module_candidates)})")
          if missing:
              print("Missing required Linux GPU Python packages for PyInstaller collect_all():")
              for pkg in missing:
                  print(f" - {pkg}")
              sys.exit(1)
          PY

      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller==6.18.0

      # --- GPU Wheels (Only for Windows GPU build) ---
      - name: Install CUDA 12 & cuDNN 9 DLL Wheels (GPU Only)
        if: runner.os == 'Windows' && matrix.is_gpu
        run: |
          python -m pip install nvidia-cuda-runtime-cu12 nvidia-cudnn-cu12 nvidia-cublas-cu12 nvidia-cufft-cu12 nvidia-curand-cu12

      # --- PyInstaller Compilation ---
      - name: Build with PyInstaller (${{ matrix.spec }})
        run: |
          pyinstaller ${{ matrix.spec }} --noconfirm --clean

      # Models are downloaded by the application into its writable models folder.
      # Keep GPU runtime DLLs beside the Windows GPU build; they are not model weights.
      - name: Harvest CUDA DLLs (Windows GPU)
        if: runner.os == 'Windows' && matrix.is_gpu
        shell: pwsh
        run: |
          $distSubfolder = (Get-ChildItem -Path "dist" -Directory | Select-Object -First 1).FullName
          $sitePackages = python -c "import site; print(site.getsitepackages()[0])"
          Get-ChildItem -Path "$sitePackages\nvidia" -Recurse -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination "$distSubfolder\_internal" -Force
          }

      # --- 512 MB Split Compression ---
      - name: Compress into 512MB Multi-part Zips (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $distSubfolder = (Get-ChildItem -Path "dist" -Directory | Select-Object -First 1).FullName
          $archiveName = "MangaCleaner-${{ env.VERSION }}-${{ matrix.target }}.zip"
          7z a -v512m $archiveName "$distSubfolder\*"

      - name: Compress into 512MB Multi-part Zips (Linux)
        if: runner.os == 'Linux'
        run: |
          DIST_SUBFOLDER=$(find dist -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ARCHIVE_NAME="MangaCleaner-${{ env.VERSION }}-${{ matrix.target }}.zip"
          7z a -v512m "$ARCHIVE_NAME" "$DIST_SUBFOLDER/*"

      # --- Upload Staged Artifacts ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.target }}
          path: MangaCleaner-*-${{ matrix.target }}.zip*
          if-no-files-found: error

  # ==========================================
  # STAGE 2: Aggregate & Publish GitHub Release
  # ==========================================
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Release Version Variable
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.event.inputs.version_tag || 'v3.2.0' }}" >> $GITHUB_ENV
          fi

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          merge-multiple: true
          path: release-assets

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Manga Cleaner ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/MangaCleaner-*.zip*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
